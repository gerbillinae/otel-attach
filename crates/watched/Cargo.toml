[package]
name = "otel-attach-watched"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The watched side of the attach protocol: tracing events as OpenTelemetry records for attachers over ZeroMQ"

[dependencies]
otel-attach-protocol.workspace = true
opentelemetry = { version = "0.33.1", default-features = false, features = ["logs"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["logs"] }
opentelemetry-appender-tracing = "0.33.1"
opentelemetry-proto = { version = "0.33.1", default-features = false, features = ["gen-tonic-messages", "logs"] }
prost = "0.14.5"
bytes = "1"
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }
zeromq = { version = "0.7.0", default-features = false, features = ["tokio-runtime", "tcp-transport"] }
getrandom = "0.3"
gethostname = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "time", "sync", "macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }
