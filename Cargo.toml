[workspace]
resolver = "3"
members = ["crates/protocol", "crates/watched", "apps/otel-attach", "crates/ring", "crates/client"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
otel-attach-protocol = { path = "crates/protocol" }
otel-attach-ring = { path = "crates/ring" }
otel-attach-client = { path = "crates/client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
